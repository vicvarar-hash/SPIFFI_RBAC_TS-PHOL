rules:
# ═══════════════════════════════════════════════════════════════════
# DOMAIN & STRUCTURAL GATES
# Catch domain mismatches and ABAC propagation
# ═══════════════════════════════════════════════════════════════════
- rule_name: task_bundle_domain_mismatch
  description: Deny when the proposed bundle belongs to a different domain than the task
  if:
    - predicate: TaskBundleDomainMismatch
      equals: true
    - predicate: SelectionToleranceActive
      equals: false
  then: DENY
  derive: IrrelevantBundle
  priority: 120

- rule_name: validation_failure_denial
  description: Deny when the validator flags critical failure AND the alignment score is also low (cross-check to avoid single-vote vetoes on correct bundles)
  if:
    - predicate: CriticalValidationFailure
      equals: true
    - predicate: TaskAlignmentScore
      lt: 0.5
  then: DENY
  derive: TaskMismatch
  priority: 110

- rule_name: severe_domain_mismatch_override
  description: Re-engage domain-mismatch denial in selection mode when the alignment score also collapses (two-signal cross-check that bypasses SelectionToleranceActive)
  if:
    - predicate: TaskBundleDomainMismatch
      equals: true
    - predicate: AlignmentEvaluated
      equals: true
    - predicate: TaskAlignmentScore
      lt: 0.4
  then: DENY
  derive: IrrelevantBundle
  priority: 115

- rule_name: bundle_irrelevant_strong
  description: Deny when the validator marks the bundle irrelevant AND the alignment score is low
  if:
    - predicate: BundleIrrelevantToTask
      equals: true
    - predicate: TaskAlignmentScore
      lt: 0.5
    - predicate: AlignmentEvaluated
      equals: true
  then: DENY
  derive: IrrelevantBundle
  priority: 95

# ═══════════════════════════════════════════════════════════════════
# CAPABILITY COVERAGE (Two-Tier: only hard misses deny)
# This is a unique TS-PHOL value — catches same-domain wrong bundles
# ═══════════════════════════════════════════════════════════════════
- rule_name: hard_capability_violation
  description: Deny when a mission-critical capability is missing from the tool bundle
  if:
    - predicate: HardCapabilityMissing
      equals: true
    - predicate: SelectionToleranceActive
      equals: false
  then: DENY
  derive: CriticalCapabilityGap
  priority: 105

# ═══════════════════════════════════════════════════════════════════
# WRITE SAFETY (destructive operations only)
# Catches delete/drop without preceding read verification
# ═══════════════════════════════════════════════════════════════════
- rule_name: destructive_write_prevention
  description: Deny destructive operations (delete/drop) without accompanying read verification
  if:
    - predicate: ContainsDelete
      equals: true
    - predicate: ContainsRead
      equals: false
  then: DENY
  derive: UnsafeDestructiveWrite
  priority: 100

- rule_name: mutation_without_context_read
  description: Deny high-risk writes that are not preceded by a read (verify-before-mutate ordering — a relational property RBAC/ABAC cannot express)
  if:
    - predicate: ContainsWrite
      equals: true
    - predicate: ContainsReadBeforeWrite
      equals: false
    - predicate: HighestRiskLevel
      equals: high
  then: DENY
  derive: UnsafeBlindMutation
  priority: 102

# ═══════════════════════════════════════════════════════════════════
# RISK DETECTION
# ═══════════════════════════════════════════════════════════════════
- rule_name: elevated_risk_detection
  description: Identify high-risk multi-domain scenarios
  if:
    - predicate: HighestRiskLevel
      equals: high
    - predicate: MultiDomain
      equals: true
  then: ALLOW
  derive: ElevatedRisk
  priority: 80

# ═══════════════════════════════════════════════════════════════════
# ALIGNMENT GATES
# Catches semantically irrelevant bundles (wrong tools for the task)
# ═══════════════════════════════════════════════════════════════════
- rule_name: low_task_alignment
  description: Deny when the bundle is semantically irrelevant to the task
  if:
    - predicate: AlignmentEvaluated
      equals: true
    - predicate: TaskAlignmentScore
      lt: 0.3
    - predicate: SelectionToleranceActive
      equals: false
  then: DENY
  derive: LowAlignment
  priority: 60

- rule_name: low_task_alignment_with_tolerance
  description: Deny when the bundle is semantically irrelevant to the task, even with tolerance
  if:
    - predicate: AlignmentEvaluated
      equals: true
    - predicate: TaskAlignmentScore
      lt: 0.25
    - predicate: SelectionToleranceActive
      equals: true
  then: DENY
  derive: LowAlignment
  priority: 60

- rule_name: multi_domain_low_alignment
  description: Deny multi-domain bundles whose alignment with the task is weak (TS-PHOL-unique signal)
  if:
    - predicate: MultiDomain
      equals: true
    - predicate: AlignmentEvaluated
      equals: true
    - predicate: TaskAlignmentScore
      lt: 0.6
  then: DENY
  derive: UnjustifiedCrossDomain
  priority: 70

# ═══════════════════════════════════════════════════════════════════
# CAPABILITY COVERAGE — GRADUATED
# Goes beyond binary hard-cap check: scores how much of the required
# capability set the bundle actually covers. Pure TS-PHOL accounting —
# RBAC/ABAC have no concept of capability sufficiency.
# ═══════════════════════════════════════════════════════════════════
- rule_name: partial_capability_coverage
  description: Deny when the bundle covers less than half of the task's required capabilities
  if:
    - predicate: CapabilityCoverageScore
      lt: 0.5
    - predicate: AlignmentEvaluated
      equals: true
  then: DENY
  derive: InsufficientCapabilityCoverage
  priority: 65

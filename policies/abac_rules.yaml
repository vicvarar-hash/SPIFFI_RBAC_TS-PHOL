# ═══════════════════════════════════════════════════════════════════════
# PALADIN ABAC — attribute rules as DATA (rules-as-data).
#
# This file is the single source of truth for the ABAC layer. It is loaded
# BOTH by the Python engine (app/services/abac_engine.ABACEngine, a generic
# evaluator) AND by OPA as a `data` document (data.rules), evaluated by the
# generic policies/rego/abac.rego. There is NO code generation: edit rules
# here (or in Policy Studio) and both engines pick them up.
#
# Semantics: a rule DENIES when EVERY condition in match_attributes holds
# (logical AND); the request is denied if ANY rule fires. A condition whose
# attribute is absent does not match (per-condition fail-closed), except `!=`
# which holds for an absent attribute — mirroring the Python comparator.
#
# Six rules in three attribute families:
#   ① department isolation — compliance/sensitivity stays in its department
#   ② clearance gates      — risk- and destructiveness-graduated clearance
#   ③ trust gate           — minimum trust to write
# ═══════════════════════════════════════════════════════════════════════
rules:
# ── ① Department isolation ─────────────────────────────────────────────
- id: abac_financial_compliance_isolation
  description: Financial / PCI-DSS resources are restricted to the Finance department.
  action: deny
  failure_reason: 'Access denied: financial-compliance data requires the Finance department'
  match_attributes:
  - source: resource
    attribute: compliance_tier
    op: in
    value: [Financial, PCI-DSS]
  - source: subject
    attribute: attributes.department
    op: '!='
    value: Finance

- id: abac_infrastructure_write_isolation
  description: Writes to Infrastructure-sensitive resources require Engineering or Infrastructure.
  action: deny
  failure_reason: 'Access denied: infrastructure write access restricted to Engineering/Infrastructure'
  match_attributes:
  - source: resource
    attribute: data_sensitivity
    op: ==
    value: Infrastructure
  - source: action
    attribute: contains_write
    op: ==
    value: true
  - source: subject
    attribute: attributes.department
    op: '!='
    value: Engineering
  - source: subject
    attribute: attributes.department
    op: '!='
    value: Infrastructure

# ── ② Clearance gates ──────────────────────────────────────────────────
- id: abac_clearance_read_high_risk
  description: Reading high-risk resources requires at least L2 clearance (denies L1).
  action: deny
  failure_reason: 'Access denied: minimum L2 clearance required for high-risk resources'
  match_attributes:
  - source: resource
    attribute: risk_level
    op: ==
    value: high
  - source: subject
    attribute: attributes.clearance_level
    op: ==
    value: L1

- id: abac_clearance_write_high_risk
  description: Writing to high-risk resources requires L3 clearance.
  action: deny
  failure_reason: 'Access denied: L3 clearance required for high-risk write operations'
  match_attributes:
  - source: resource
    attribute: risk_level
    op: ==
    value: high
  - source: action
    attribute: contains_write
    op: ==
    value: true
  - source: subject
    attribute: attributes.clearance_level
    op: '!='
    value: L3

- id: abac_destructive_requires_L3
  description: Destructive operations (delete / drop / purge / truncate …) require L3 clearance.
  action: deny
  failure_reason: 'Access denied: L3 clearance required for destructive operations'
  match_attributes:
  - source: action
    attribute: contains_destructive_write
    op: ==
    value: true
  - source: subject
    attribute: attributes.clearance_level
    op: '!='
    value: L3

# ── ③ Trust gate ───────────────────────────────────────────────────────
- id: abac_low_trust_write
  description: Writing requires a trust score of at least 0.8.
  action: deny
  failure_reason: 'Access denied: trust score too low for write operations'
  match_attributes:
  - source: action
    attribute: contains_write
    op: ==
    value: true
  - source: subject
    attribute: attributes.trust_score
    op: <
    value: '0.8'

# Least-privilege RBAC: domain-scope by job function to kill null/cross-domain;
# tool lists prefer role-typical ops so wrong same-domain bundles fall through
# to default_deny. Gateway is execution plane (broad allow); security is read-audit.
# Destructive/high-impact tools omitted unless core to the persona's duty.
policies:
  - spiffe_id: "spiffe://demo.local/agent/devops"
    description: "L3 Engineering — monitoring, infra diagnostics, ops DB read"
    rules:
      - { mcp: "grafana", tools: ["*"], action: "allow", rule_name: "devops_grafana_all" }
      - { mcp: "azure", tools: ["azmcp-appconfig-account-list", "azmcp-appconfig-kv-list", "azmcp-appconfig-kv-lock", "azmcp-appconfig-kv-set", "azmcp-appconfig-kv-show", "azmcp-appconfig-kv-unlock", "azmcp-cosmos-account-list", "azmcp-cosmos-database-container-item-query", "azmcp-cosmos-database-container-list", "azmcp-cosmos-database-list", "azmcp-extension-az", "azmcp-extension-azd", "azmcp-group-list", "azmcp-monitor-log-query", "azmcp-monitor-table-list", "azmcp-monitor-workspace-list", "azmcp-search-index-describe", "azmcp-search-index-list", "azmcp-search-index-query", "azmcp-search-service-list", "azmcp-storage-account-list", "azmcp-storage-blob-container-details", "azmcp-storage-blob-container-list", "azmcp-storage-blob-list", "azmcp-storage-table-list", "azmcp-subscription-list"], action: "allow", rule_name: "devops_azure_ops_read" }
      - { mcp: "mongodb", tools: ["aggregate", "collection-indexes", "collection-schema", "collection-storage-size", "connect", "count", "db-stats", "explain", "export", "find", "list-collections", "list-databases", "mongodb-logs"], action: "allow", rule_name: "devops_mongo_read" }
      - { mcp: "atlassian", tools: ["confluence_get_comments", "confluence_get_labels", "confluence_get_page", "confluence_get_page_children", "confluence_search", "jira_batch_get_changelogs", "jira_download_attachments", "jira_get_agile_boards", "jira_get_board_issues", "jira_get_issue", "jira_get_link_types", "jira_get_project_issues", "jira_get_project_versions", "jira_get_sprint_issues", "jira_get_sprints_from_board", "jira_get_user_profile", "jira_get_worklog", "jira_search", "jira_search_fields"], action: "allow", rule_name: "devops_atlassian_read" }
      - { mcp: "*", tools: ["*"], action: "deny", rule_name: "default_deny" }


tsphol_rules:
# ═══════════════════════════════════════════════════════════════════
# TRAC — Task-Relational Access Control over the proposed tool bundle.
#
# Four rules, each conditioning on the task<->bundle relation — which conventional
# RBAC (persona->domain->tool) and ABAC (subject/resource attributes) do not express;
# TRAC does, task/MCP-agnostically (a capability is {domain}:{action} = the tool's
# MCP + read/write). Expressible over derived attributes on a standard engine
# (OPA/Rego parity verified) — this is the predicate, not a new engine.
#
# Two ENFORCING rules change ALLOW/DENY; two ADVISORY rules only annotate the audit:
#   1. capability_coverage — ENFORCING. Denies bundles that cannot operate in the
#      task's declared (BM25-inferred) domain.
#   2. tool_relevance      — ENFORCING. Denies bundles whose selected tools have low
#      BM25 relevance to the task text (complements capability_coverage).
#   3. write_safety        — ADVISORY (enforce: false). Alerts on destructive ops
#      without a verifying read (a legitimate vs. dangerous delete is semantic).
#   4. action_coherence    — ADVISORY (enforce: false). Alerts on a read-intent task
#      paired with a mutating bundle.
# Every bundle is assessed by all four; only enforcing rules change ALLOW/DENY.
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# 1. CAPABILITY COVERAGE (domain coverage)  —  ENFORCING
# Deny when the bundle does not operate in the task's declared domain — i.e. it is
# in the wrong domain or empty. Required = {domain}:read (the action floor; any
# in-domain tool covers it, since a write also grants the read). Read-vs-write
# *intent* is deliberately NOT inferred from task text — that heuristic falsely
# denied correct read-only bundles. Mutation concerns are owned by write_safety.
#
# The task's declared domain is inferred leak-free by BM25 (task_domain_classifier).
# Two tunable guards reduce false-denies from BM25's noisy single-best guess
# (env-overridable; see the cited services):
#   * CAPCOV_TOPK (default 1) — accept a bundle whose domain is in the task's top-K
#     inferred domains. K=1 is strict top-1; larger K trades security ~1:1.
#   * corroborated rescue (tool_relevance.RESCUE_RELEVANCE, default 4.0) — reverse a
#     domain-mismatch denial when the selected tools are strongly relevant to the task
#     (high BM25). A Pareto improvement: rescues mis-inferred legit bundles at near-zero
#     catch cost, because wrong-domain/null attacks score low on tool relevance.
# ───────────────────────────────────────────────────────────────────
- rule_name: capability_coverage
  description: Deny when the bundle does not operate in the task's declared domain (wrong domain or empty).
  if:
    - predicate: HardCapabilityMissing
      equals: true
  then: DENY
  enforce: true
  derive: CapabilityGap
  priority: 105

# ───────────────────────────────────────────────────────────────────
# 2. WRITE SAFETY (verify-before-destroy)  —  ADVISORY
# Flags destructive operations (delete/drop) not preceded by a read in the same
# bundle. Run as ADVISORY (enforce: false): it raises an alert on every matching
# bundle for audit / human / LLM escalation, but does NOT block. Measurement showed
# it cannot deterministically separate a legitimate user-requested delete (e.g.
# "purge SEC-199") from a dangerous one (delete-many on an analytical task) — both
# are delete-without-read — so hard-blocking cost legitimate work (27 legit deletes)
# for little security gain (+0.002 SecFail). As an alert it keeps full signal.
# ───────────────────────────────────────────────────────────────────
- rule_name: write_safety
  description: Flag (advisory) destructive operations (delete/drop) not preceded by a verifying read.
  if:
    - predicate: ContainsDelete
      equals: true
    - predicate: ContainsReadBeforeWrite
      equals: false
  then: DENY
  enforce: false
  derive: UnsafeDestructiveWrite
  priority: 100

# ───────────────────────────────────────────────────────────────────
# 3. ACTION COHERENCE (read-intent vs mutating bundle)  —  ADVISORY
# Flags a read-only-intent task (deterministic, high-precision text check) paired with a
# destructive tool bundle. Recovers a slice of the same-domain wrong-tool cases RBAC/ABAC
# cannot see, but task-text intent is noisier than tool action, so it ADVISES (enforce:
# false) rather than blocks — surfacing the deterministic warning without false-deny cost.
# ───────────────────────────────────────────────────────────────────
- rule_name: action_coherence
  description: Flag (advisory) a read-intent task that selected destructive/mutating tools.
  if:
    - predicate: ReadIntentMutatingBundle
      equals: true
  then: DENY
  enforce: false
  derive: ActionIncoherence

# ───────────────────────────────────────────────────────────────────
# 4. TOOL RELEVANCE (selected tools vs task)  —  ENFORCING (leak-free)
# The tool-level analogue of capability_coverage: capability_coverage checks the bundle is in the
# right DOMAIN; this checks the selected TOOLS are relevant to the task, by BM25 of each tool's
# catalog description against the task text (agnostic, leak-free — no gold, no hardcoded domains).
# ENFORCING: with the leak-free BM25 domain check (which misses ~1/3 of wrong-domain bundles to
# inference error), tool-relevance has a COMPLEMENTARY failure mode — the bundles the domain check
# misses usually have irrelevant tools too. Measured (gpt-5.4 val, n=6942): adding this rule as
# enforcing cut SecFail 34.8%->16.4% and raised stack precision 63%->71% (its own catches are 82%
# precise) for a modest legit-allow cost (83.5%->78%). (Under the discarded gold domain it only
# added false-blocks; that was an oracle artifact.) write_safety/action_coherence stay advisory.
# ───────────────────────────────────────────────────────────────────
- rule_name: tool_relevance
  description: Deny when the selected tools are lexically irrelevant to the task (low BM25 — complements capability_coverage).
  if:
    - predicate: BundleToolsIrrelevant
      equals: true
  then: DENY
  enforce: true
  derive: IrrelevantToolSelection
  priority: 95

